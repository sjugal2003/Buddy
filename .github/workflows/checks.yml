# Runs every check on each pull request and on main. Uses a throwaway local
# Supabase inside GitHub's machine; it never touches the hosted project and
# needs no secrets. Actions are pinned to an exact commit (the version is in
# the comment); Dependabot proposes updates (.github/dependabot.yml).
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Fails when a package Buddy uses has a known high or critical security
      # problem. Fix it by upgrading that package on its own, never with
      # `npm audit fix --force` (PROJECT_CONTEXT.md §12).
      - name: Package security check
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Start local Supabase
        run: |
          npx supabase start -x storage-api,imgproxy,realtime,studio,edge-runtime,logflare,vector,postgres-meta,supavisor
          npx supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY)=' | sed -e 's/^API_URL=/NEXT_PUBLIC_SUPABASE_URL=/' -e 's/^PUBLISHABLE_KEY=/NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=/' -e 's/"//g' >> "$GITHUB_ENV"

      - name: Database security tests
        run: npm run test:db

      - name: Build
        run: npm run build

      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Keep the browser test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
