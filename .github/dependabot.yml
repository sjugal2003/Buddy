# Dependabot (free, built into GitHub) looks for package updates once a week
# and opens a pull request for them. Small updates come together in one pull
# request.
# Dependabot pull requests go through the same checks as any other. Ask
# Claude to look at one before merging it.
#
# Big (major) version jumps of any package (for example Next.js 16,
# TypeScript 7, Vitest 5, or Node types for a newer Node) can change how Buddy
# is built or tested and need their own planned upgrade, so Dependabot doesn't
# propose them. Security fixes for the versions Buddy uses still come as small
# updates.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kolkata
    open-pull-requests-limit: 3
    groups:
      small-updates:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Kolkata
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
